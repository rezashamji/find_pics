[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findpics"
version = "0.1.0"
description = "Local, read-only natural-language search over your photo library that tells you how complete the answer is."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy", "pandas", "pyarrow", "pillow", "pillow-heif", "av", "pydantic>=2",
  "torch", "torchvision", "transformers>=4.50", "open_clip_torch", "timm", "insightface", "opencv-python-headless",
  "scikit-learn", "scipy",
]

[project.optional-dependencies]
# vllm pin matters: unpinned, the resolver picks the newest torch and backtracks to an ancient vllm that can't build.
# nvidia-*-cu12: onnxruntime-gpu's CUDA provider needs CUDA 12 libs even when torch ships CUDA 13.
gpu = ["vllm>=0.30", "onnxruntime-gpu", "nvidia-cuda-runtime-cu12", "nvidia-cublas-cu12", "nvidia-cufft-cu12",
       "nvidia-curand-cu12", "nvidia-cudnn-cu12>=9,<10", "nvidia-cuda-nvrtc-cu12"]
mac = ["osxphotos", "mlx-vlm>=0.7", "onnxruntime"]
dev = ["pytest"]

[project.scripts]
findpics = "findpics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
